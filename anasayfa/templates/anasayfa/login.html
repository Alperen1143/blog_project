{% extends "anasayfa/base.html"%}
{% block content%}

<div class="auth-container">
    <h2>Giriş Yap</h2>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message}}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>kullanıcı Adı veya E -Mail</label>
            <input
                type="text"
                name="username_or _email"
                placeholder="Kullanıcı Adı veya E -Mail"
                required
            >
        </div>

        <div class="form-group">
            <label>şifre</label>
            <input
                type="password"
                name="password"
                placeholder="Şifre"
                required
            >
        </div>

        <button type="submit">Giriş Yap</button>
    </form>
</div>

{% endblock %}
